<section class="section gallery" id="gallery">

    <h2 class="gallery-title">Photo Gallery</h2>

    <p class="gallery-subtitle">
      Discover the E-Bike Nova in stunning detail.
    </p>

    <ul class="gallery-list">
      <li class="gallery-item">
        <picture>
          <source
            media="(min-width: 1440px)"
            srcset="
              /img/gallery/desktop/gallery1-desktop.jpg    1x,
              /img/gallery/desktop/gallery1-desktop@2x.jpg 2x
            "
          />

          <source
            media="(min-width: 768px)"
            srcset="
              /img/gallery/tablet/gallery1-tablet.jpg    1x,
              /img/gallery/tablet/gallery1-tablet@2x.jpg 2x
            "
          />

          <img
            class="gallery-image"
            src="/img/gallery/mobile/gallery1-mobile.jpg"
            srcset="/img/gallery/mobile/gallery1-mobile@2x.jpg 2x"
            alt="Cyclist taking the battery out of an E-Bike Nova frame"
            loading="lazy"
          />
        </picture>
      </li>

        <ul class="gallery-inner-list">
