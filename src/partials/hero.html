<section class="section hero-section" id="hero">
  <div class="container hero-container">
    <div class="content-wrapper hero-wrapper">
      <h1 class="hero-title">Unleash Your Ride with E-Bike Nova</h1>
      <div class="content-wrapper description-content">
        <p class="hero-description">
          Discover the future of urban commuting with the E-Bike Nova, where
          innovation meets eco-conscious design. Experience lightweight
          performance and extended range for an unparalleled ride.
        </p>
        <ul class="hero-links-list">
          <li class="hero-links-item">
            <a href="#price" class="hero-link order-now-link">Order Now</a>
          </li>
          <li class="hero-links-item">
            <a href="#about-bike" class="hero-link learn-more-link"
              >Learn More</a
            >
          </li>
        </ul>
      </div>
    </div>

    <!-- HERO IMAGE -->

    <div class="hero-img-wrapper">
      <picture>
        <source
          media="(min-width: 1440px)"
          srcset="
            /img/hero/desktop/hero-desktop.jpg    1x,
            /img/hero/desktop/hero-desktop@2x.jpg 2x
          "
        />
        <source
          media="(min-width: 768px)"
          srcset="
            /img/hero/tablet/hero-tablet.jpg    1x,
            /img/hero/tablet/hero-tablet@2x.jpg 2x
          "
        />
        <img
          src="/img/hero/mobile/hero-mobile.jpg"
          srcset="/img/hero/mobile/hero-mobile@2x.jpg 2x"
          alt="bike on orange background"
        />
      </picture>
    </div>
  </div>
</section>
